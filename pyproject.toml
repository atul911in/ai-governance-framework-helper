[tool.poetry]
name = "ai-governance-framework-helper"
version = "0.1.0"
description = "A multi-agent LangGraph application that provides AI governance guidance across different countries and regulatory frameworks."
authors = []
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2"
langchain-openai = "^0.2"
openai = "^1.0"
fastapi = "^0.115"
uvicorn = "^0.32"
pydantic = "^2.0"
streamlit = "^1.39"
hypothesis = "^6.0"
pytest = "^8.0"
weasyprint = "^62.0"
python-dotenv = "^1.0"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^0.24"
black = "^24.0"
ruff = "^0.7"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
